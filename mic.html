<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Minutes — microphone</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="popup.css" />
  <style>
    /* This page borrows the notebook's stylesheet but is a full tab. */
    html, body { width: auto; height: 100%; }
    .mic-wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-card {
      max-width: 420px;
      text-align: center;
      padding: 48px 40px;
    }
    .mic-card h1 { margin-bottom: 14px; }
    .mic-card p {
      font-size: 14.5px;
      line-height: 24px;
      color: var(--ink-soft);
      margin-bottom: 26px;
    }
    #allow {
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--paper-bright);
      background: linear-gradient(to bottom, var(--seal-bright), var(--seal-deep));
      border-radius: 999px;
      padding: 10px 26px;
      box-shadow: 0 3px 8px rgba(124, 29, 21, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    #allow:active { transform: translateY(1px); box-shadow: 0 1px 3px rgba(124, 29, 21, 0.35); }
    #done { color: var(--ink-soft); font-family: var(--hand); font-size: 22px; }
  </style>
</head>
<body>
  <div class="mic-wrap">
    <div class="mic-card">
      <h1>One small thing.</h1>
      <p>So both sides of your meetings make it into the minutes, Minutes needs to hear your microphone as well as the tab. Chrome will ask once&mdash;after that, just press the seal whenever you want a meeting taken down.</p>
      <button id="allow" type="button">Allow the microphone</button>
      <p id="done" class="hidden"></p>
    </div>
  </div>
  <script src="mic.js"></script>
</body>
</html>
